id = "dotredstone/touch-controls"
name = "Touch Controls"
version = "2.1.0"
plugin_api = 15
min_noctalia = "5.0.0"
author = "DotRedstone"
license = "MIT"
icon = "hand-finger"
description = "Touch-first controls for Noctalia and Niri tablets."
tags = ["touch", "tablet", "niri", "utility"]
dependencies = ["sheng-niri-touch-action", "sheng-niri-key", "sheng-niri-display", "sheng-niri-osk-toggle"]

[[widget]]
id = "controls"
entry = "widget.luau"

[[widget]]
id = "back"
entry = "back.luau"

[[widget]]
id = "fullscreen"
entry = "fullscreen.luau"

[[widget]]
id = "close-window"
entry = "close-window.luau"

[[widget]]
id = "keyboard-toggle"
entry = "keyboard-widget.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 500
placement = "floating"
position = "center"

[[panel]]
id = "keyboard"
entry = "keyboard.luau"
width = 1120
height = 390
position = "bottom_center"
keyboard_focus = "none"
dismiss_on_outside_click = false
persistent = true
